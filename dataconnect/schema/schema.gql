type User @table {
  username: String!
  email: String!
  avatarUrl: String
  createdAt: Timestamp
}

type LeaderboardCategory @table {
  name: String!
  description: String!
  isActive: Boolean
}

type Season @table {
  name: String!
  startDate: Timestamp!
  endDate: Timestamp!
  isCurrent: Boolean
}

type Score @table {
  value: Int64!
  submittedAt: Timestamp!
  user: User!
  category: LeaderboardCategory!
  season: Season!
}

type RankSnapshot @table {
  rankPosition: Int!
  scoreValue: Int64!
  user: User!
  category: LeaderboardCategory!
  season: Season!
}